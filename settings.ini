; ==============================================================================
; MouseUtilities - Unified Configuration File
; ==============================================================================
; This configuration file contains settings for eight integrated utilities:
; 1. ShowCursor - Find your cursor with PowerToys integration
; 2. SnippetAndRecord - Tap for screenshot, hold for recording
; 3. UndoRedo - Mouse button undo/redo for configured apps
; 4. DraggingUtility - Context-aware mouse button for FancyZones
; 5. SmoothTrackball - Smooth scrolling with trackball
; ==============================================================================

; ==============================================================================
; SHOW CURSOR SETTINGS
; ==============================================================================
[ShowCursor_Settings]
; Mode 1: Hold to Show (Pass-through normal key press, hold to trigger)
; Mode 2: Toggle Override (Blocks normal key function, press to trigger)
Mode=1

; The key you press to activate the script
; Examples: LControl, RControl, F1, MButton, XButton1, XButton2
TriggerKey=XButton1

; The key combination sent to the system to trigger PowerToys Find My Mouse
; Examples: F13, ^!p (Ctrl+Alt+P), #+m (Win+Shift+M)
; Ensure this matches your PowerToys settings or intended target.
TargetHotkey=#+F

; Duration in milliseconds to hold the TriggerKey (Only used in Mode 1)
HoldDuration=200

; ==============================================================================
; SNIPPET AND RECORD SETTINGS
; ==============================================================================
[SnippetAndRecord_Settings]
; The key or key combination to trigger the script.
; Examples:
;   XButton2      -> Mouse Button 5 (Forward)
;   XButton1      -> Mouse Button 4 (Back)
;   MButton       -> Middle Mouse Button
;   F8            -> F8 Key
;   ^Space        -> Ctrl + Space
;   !z            -> Alt + Z
;   +#F10         -> Shift + Win + F10
;
; Note:
;   - Tap (release < HoldDuration) = Snipping Tool (Win+Shift+S)
;   - Hold (hold > HoldDuration)   = Screen Record (Win+Shift+R)
TriggerKey=^+#F10

; Time in milliseconds to distinguish between a Tap and a Hold.
HoldDuration=200

; Set to 1 (Visible) or 0 (Hidden).
ShowTrayIcon=0

; ==============================================================================
; SMOOTH TRACKBALL SCROLLING - HOTKEYS
; ==============================================================================
[Trackball_Hotkeys]
; Hotkeys to control smooth scrolling.
; Can be any AutoHotKey hotkey string representing a single unmodified key or button (e.g. F1, MButton, LControl).
; The use of more complex hotkey strings involving modifiers (e.g. ^F1, ~MButton, LControl Up) may cause issues.
; Depending on the selected mode, hotkey2 may or may not be used.
hotkey1=XButton2
hotkey2=MButton

; Button to stop smooth scrolling (optional).
stopKey=

; Button to force-quit the entire MouseUtilities script.
panicButton=F3

; Various ways to control smooth scrolling.
; ON_OFF:                   Smooth scrolling is turned on when hotkey1 is pressed down, and turned off when hotkey2 is pressed down.
; ONE_KEY_TOGGLE:           Smooth scrolling is toggled when hotkey1 is pressed. Original functionality of hotkey1 is blocked.
; ONE_KEY_MOMENTARY:        Smooth scrolling is turned on while hotkey1 is held. Original functionality of hotkey1 is blocked.
; ONE_KEY_TAP_TOGGLE:       Smooth scrolling is toggled when hotkey1 is tapped for shorter than holdDuration. Original functionality is retained if hotkey1 is held.
; ONE_KEY_HOLD_TOGGLE:      Smooth scrolling is toggled when hotkey1 is held for longer than holdDuration. Original functionality is retained if hotkey1 is tapped.
; ONE_KEY_HOLD_MOMENTARY:   Smooth scrolling is turned on while hotkey1 is held for longer than holdDuration. Original functionality is retained if hotkey1 is tapped.
; TWO_KEY_TAP_TOGGLE:       Smooth scrolling is toggled when hotkey1 and hotkey2 are simultanously tapped for shorter than holdDuration.
; TWO_KEY_HOLD_TOGGLE:      (not implemented) Smooth scrolling is toggled when hotkey1 and hotkey2 are simultanously held for longer than holdDuration.
; TWO_KEY_HOLD_MOMENTARY:   (not implemented) Smooth scrolling is turned on while hotkey1 and hotkey2 are simultanously held for longer than holdDuration.
mode=ONE_KEY_HOLD_MOMENTARY

; Only relevant if a TAP or HOLD mode is used.
; Controls the duration, in milliseconds, that differentiates between a tap and a hold.
holdDuration=200

; ==============================================================================
; SMOOTH TRACKBALL SCROLLING - TEXTURE
; ==============================================================================
[Trackball_Texture]
; Sensitivity.
; Can be any non-zero real number.
; Negative values can be used to invert scroll direction.
sensitivity=2

; How often the script runs, in milliseconds.
; Higher values can increase reliability at the cost of smoothness.
; Must be an integer greater than or equal to 10.
; A value of 10 is recommended, but if you experience some apps responding weirdly, try bumping it up to around 16 or 20.
refreshInterval=10

; How much smoothing to apply.
; Lower settings are snappier, while higher settings have more smoothness and momentum.
; Must be an integer greater than or equal to 1.
; A value of around 3 to 10 is recommended.
smoothingWindowMaxSize=1

; ==============================================================================
; SMOOTH TRACKBALL SCROLLING - AXIS SNAPPING
; ==============================================================================
[Trackball_AxisSnapping]
; Whether or not to use axis snapping at the start of the script.
; Must be true or false.
; Note that several apps, including chromium-based browsers, will have problems if angle snapping is turned off.
; Therefore, it is recommended that you leave this on unless you specifically need omnidirectional scrolling.
snapOnByDefault=true

; The snap ratio controls how much your movement direction can deviate from the axis before you become un-snapped.
; A higher value will make it harder to un-snap from an axis.
; Must be a positive real number.
; A value of 1.5 is recommended, but this depends on how you want your snapping to work.
snapRatio=1.5

; The snap threshold controls how much you have to move perpendicular to the axis before you become un-snapped.
; A higher value will make it harder to un-snap from an axis.
; Must be a positive real number.
; A value of 10 is recommended, but this depends on how you want your snapping to work.
snapThreshold=10

; Comma-separated list of window titles for which axis snapping should be disabled.
; Partial matches are supported.
disableSnapFor=Affinity

; ==============================================================================
; SMOOTH TRACKBALL SCROLLING - ACCELERATION
; ==============================================================================
[Trackball_Acceleration]
; Whether or not to apply an acceleration curve (https://www.desmos.com/calculator/bchynqgg5g) to smooth scrolling.
; Must be true or false.
; Note that, if you use Windows mouse acceleration, that acceleration will be applied independently of this setting.
; Therefore, this setting is mostly for people who don't want acceleration on their cursor movement, but want it when scrolling.
accelerationOn=false

; Controls the shape of the acceleration curve.
; Must be a real number between 0 and 1.
; A value of 0.872116 is recommended, since this best replicates the Windows mouse acceleration curve.
accelerationBlend=0.872116

; Controls the scale of the acceleration curve.
; Must be a positive real number.
; Smaller values will result in acceleration being applied to only very slow scrolling, with linear behavior when scrolling faster.
; Larger values will result in acceleration applying to both slow and fast scrolling.
; A value of between roughly 100-1000 is recommended, but it's best to set it to taste (you might also need to tweak sensitivity).
accelerationScale=500

; ==============================================================================
; SMOOTH TRACKBALL SCROLLING - MODIFIER EMULATION
; ==============================================================================
[Trackball_ModifierEmulation]
; Enabling these options will add the respective modifiers when you scroll with your physical scroll wheel (not your trackball).
; This allows you to control pan and zoom using the same hotkey(s) as smooth scrolling.
; Each option must be true or false.
addShift=false
addCtrl=false
addAlt=false

; ==============================================================================
; SMOOTH TRACKBALL SCROLLING - CURSOR
; ==============================================================================
[Trackball_Cursor]
; The cursor to display while scrolling.
; Can be one of the following codes:
; 32512: Arrow (IDC_ARROW)
; 32513: I-Beam (IDC_IBEAM)
; 32514: Wait (IDC_WAIT)
; 32515: Cross (IDC_CROSS)
; 32516: Up Arrow (IDC_UPARROW)
; 32642: Size NW-SE (IDC_SIZENWSE)
; 32643: Size NE-SW (IDC_SIZENESW)
; 32644: Size W-E (IDC_SIZEWE)
; 32645: Size N-S (IDC_SIZENS)
; 32646: Size All (IDC_SIZEALL)
; 32648: No (IDC_NO)
; 32649: Hand (IDC_HAND)
; 32650: App Starting (IDC_APPSTARTING)
; 32651: Help (IDC_HELP)
; Set to 0 to disable cursor changing.
cursorIcon=0

; ==============================================================================
; SMOOTH TRACKBALL SCROLLING - BEHAVIOR
; ==============================================================================
[Trackball_Behavior]
; Whether to block left mouse clicks while scrolling is active.
; Must be true or false.
blockLeftClick=false

; ==============================================================================
; UNDO REDO SETTINGS
; ==============================================================================
[UndoRedo_Settings]
; Comma-separated list of window titles or process names for undo/redo mapping.
; When an app in this list is active:
;   - Tapping XButton1 (Back) sends Ctrl+Z (Undo)
;   - Tapping XButton2 (Forward) sends Ctrl+Y (Redo)
; Holding the buttons still triggers ShowCursor/SmoothTrackball as normal.
; Partial matches are supported (e.g., "Photoshop" matches "Adobe Photoshop 2024").
; Leave empty to disable this feature.
; Examples: Photoshop, GIMP, Affinity, Notepad
Apps=Affinity, draw.io, ONLYOFFICE

; Modifier key(s) that bypass undo/redo and send the original XButton1/XButton2.
; When this modifier is held, tapping XButton1/2 sends the default button instead of undo/redo.
; Comma-separated list of modifiers: Ctrl, Shift, Alt, LCtrl, RCtrl, LShift, RShift, LAlt, RAlt
; Leave empty to disable passthrough.
; Example: Ctrl
ModifierPassthrough=Ctrl

; Apps that use Ctrl+Shift+Z for redo instead of Ctrl+Y.
; Comma-separated list of window titles or process names (partial matches supported).
; Apps listed here will receive Ctrl+Shift+Z when XButton2 is tapped.
; Apps in the main Apps list but NOT here will receive Ctrl+Y (default).
; Leave empty if all your apps use Ctrl+Y for redo.
; Example: Affinity, GIMP
AlternativeRedoShortcut=Affinity

; ==============================================================================
; CAPSLOCK SHIFT SETTINGS
; ==============================================================================
[CapsLockShift_Settings]
; Remap CapsLock to function as Shift key.
; When enabled, pressing CapsLock will act as holding Shift.
; This is useful if you rarely use CapsLock and want to repurpose it.
;
; 0 = Disabled (default - CapsLock works normally)
; 1 = Enabled (CapsLock acts as Shift)
Enabled=1

; ==============================================================================
; VOLUME CONTROL SETTINGS
; ==============================================================================
[VolumeControl_Settings]
; Map custom hotkeys to volume up and volume down.
; Useful for keyboards without media keys or for custom key mappings.
; Each hotkey is enabled individually - set a key to enable, leave empty to disable.
; Both are disabled by default.

; Hotkey for increasing volume.
; Leave empty to disable (default).
; Examples: #+F12 (Win+Shift+F12), ^!Up (Ctrl+Alt+Up), +F12 (Shift+F12)
VolumeUpKey=#+F12

; Hotkey for decreasing volume.
; Leave empty to disable (default).
; Examples: #+F11 (Win+Shift+F11), ^!Down (Ctrl+Alt+Down), +F11 (Shift+F11)
VolumeDownKey=#+F11

; ==============================================================================
; WIN KEY OVERRIDE SETTINGS
; ==============================================================================
[WinKeyOverride_Settings]
; Override the Windows key tap behavior.
; Pressing and releasing Win without any other key sends a configurable key.
; Holding Win and pressing another key preserves normal Win+X combos.
;
; 0 = Disabled (default - Win key works normally)
; 1 = Enabled
Enabled=0

; The key or key combination to send when the Win key is tapped.
; Supports AutoHotkey modifier syntax:
;   ^ = Ctrl, ! = Alt, + = Shift, # = Win
; Examples:
;   F13            -> F13 key (useful for PowerToys Run or other launchers)
;   ^{Space}       -> Ctrl+Space
;   !F1            -> Alt+F1
;   ^!p            -> Ctrl+Alt+P
;   {Space}        -> Space key (use braces for key names with special meaning)
TapAction=^{Space}

; ==============================================================================
; HOTKEY CONFLICT WARNING
; ==============================================================================
; IMPORTANT: Check that your hotkeys don't conflict!
; Current defaults:
;   ShowCursor:         XButton1 (Mouse Button 4 - Back)
;   SnippetAndRecord:   Ctrl+Shift+Win+F10
;   UndoRedo:           XButton1/XButton2 (when Apps list is configured)
;   DraggingUtility:    XButton2 (Mouse Button 5 - Forward)
;   SmoothTrackball:    XButton2 (Mouse Button 5 - Forward)
;   CapsLockShift:      CapsLock (when Enabled=1)
;   VolumeControl:      (disabled by default - enable by setting VolumeUpKey/VolumeDownKey)
;
; NOTE: DraggingUtility and SmoothTrackball both default to XButton2.
; Choose one or the other, or disable one by clearing its TriggerKey/hotkey1.
;
; If you want to use the same key for multiple functions, you'll need to
; change the TriggerKey values above to avoid conflicts.
; ==============================================================================

; ==============================================================================
; DRAGGING UTILITY SETTINGS
; ==============================================================================
[DraggingUtility_Settings]
; Context-aware mouse button behavior for use with PowerToys FancyZones.
; When triggered, sends different mouse buttons depending on whether you're
; currently dragging a window or not.
;
; USE CASE: Map your forward mouse button (XButton2) to this utility.
; When dragging a window, it sends MButton (middle-click) to activate FancyZones
; zone selection. When not dragging, it sends the normal XButton2.
;
; This allows you to use one button for both FancyZones snapping AND normal
; forward button functionality.

; The key that triggers this utility.
; For FancyZones use, set this to XButton2 (forward mouse button).
; Examples: XButton2, XButton1, MButton, ^F12 (Ctrl+F12)
TriggerKey=XButton2

; The mouse button to send when you ARE dragging a window.
; Default: MButton (middle-click) - this is what FancyZones listens for.
DragAction=MButton

; The mouse button to send when you are NOT dragging a window.
; Default: XButton2 - preserves normal forward button behavior.
NonDragAction=XButton2
